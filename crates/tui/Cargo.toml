[package]
name = "agent-tui"
description = "Terminal client (ratatui + crossterm) speaking the session protocol over any transport."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-proto.workspace = true
agent-server.workspace = true
agent-kernel.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
ulid.workspace = true
tracing.workspace = true
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

[dev-dependencies]
agent-runtime.workspace = true
