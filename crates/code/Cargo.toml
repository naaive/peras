[package]
name = "agent-code"
description = "A Claude Code style coding agent built on the framework: coding system prompt, editing and planning tools, permission modes, built-in sub-agents and commands, an interactive terminal REPL and a headless print mode."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "peras"
path = "src/main.rs"

[dependencies]
agent.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
ulid.workspace = true
tracing.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"

[dev-dependencies]
tempfile.workspace = true
